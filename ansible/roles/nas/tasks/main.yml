---
# Tasks for Debian-based NAS (nas-01)

- name: Update apt cache and upgrade packages
  become: true
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
    autoremove: true
    purge: true

- name: Check for required reboot
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_required_file

- name: Notify if reboot is required
  ansible.builtin.debug:
    msg: "Reboot is required on {{ inventory_hostname }}"
  when: reboot_required_file.stat.exists

- name: Check for npm availability
  ansible.builtin.command: which npm
  register: npm_check
  failed_when: false
  changed_when: false

- name: Update global npm packages
  become: true
  ansible.builtin.command: npm update -g
  when: npm_check.rc == 0
  changed_when: true

- name: Ensure Bitwarden CLI is installed globally
  become: true
  community.general.npm:
    name: "@bitwarden/cli"
    global: true
    state: present
  when: npm_check.rc == 0
